kind: Deployment
apiVersion: apps/v1

metadata:
  name: minio
  namespace: openshift-logging

spec:

  replicas: 1

  selector:
    matchLabels:
      app: minio

  template:
    metadata:

      labels:
        app: minio

    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc

      containers:
        - name: minio
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
            requests:
              cpu: 550m
              memory: 512Mi

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: minio_root_user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: minio_root_password
          ports:
            - containerPort: 9000
              protocol: TCP
            - containerPort: 9090
              protocol: TCP

          imagePullPolicy: Always

          volumeMounts:
            - name: data
              mountPath: /data
              subPath: minio

          image: 'quay.io/minio/minio:latest'
          args:
            - server
            - /data
            - '--console-address'
            - ':9090'
